<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Kittens Online - Find Opponent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.secondary {
            background: #2ecc71;
        }

        button.secondary:hover {
            background: #27ae60;
        }

        .room-code-display {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            border: 2px dashed #667eea;
        }

        .room-code-display .code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #667eea;
            margin: 10px 0;
            font-family: monospace;
        }

        .room-code-display .label {
            font-size: 13px;
            color: #666;
        }

        .join-section {
            display: none;
            margin-bottom: 20px;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .waiting { color: #667eea; font-weight: bold; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 Exploding Kittens</h1>
        <p class="subtitle">Play online with a friend!</p>

        <div class="input-group">
            <label for="playerName">Your Name</label>
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
        </div>

        <div class="btn-group" id="mainButtons">
            <button onclick="createRoom()">Create Game</button>
            <button class="secondary" onclick="showJoinSection()">Join Game</button>
        </div>

        <div class="room-code-display" id="roomCodeDisplay">
            <div class="label">Share this code with your friend:</div>
            <div class="code" id="roomCode"></div>
            <div class="label">Waiting for them to join...</div>
        </div>

        <div class="join-section" id="joinSection">
            <div class="input-group">
                <label for="roomCodeInput">Room Code</label>
                <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="6" style="text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 20px;">
            </div>
            <button onclick="joinRoom()">Join</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const GAME_KEY = 'exploding_kittens_game';
        let peer = null;

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function createRoom() {
            const name = document.getElementById('playerName').value.trim();
            if (!name || name.length < 2) {
                showStatus('Enter a name (2+ characters)', 'error');
                return;
            }

            const code = generateCode();
            const peerId = 'eklobby-' + code;

            disableAll();
            showStatus('<span class="spinner"></span><span class="waiting">Creating room...</span>');

            peer = new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('roomCode').textContent = code;
                document.getElementById('roomCodeDisplay').style.display = 'block';
                showStatus('<span class="spinner"></span><span class="waiting">Waiting for opponent to join...</span>');

                peer.on('connection', (conn) => {
                    conn.on('open', () => {
                        conn.on('data', (data) => {
                            if (data.type === 'join') {
                                const game = {
                                    role: 'host',
                                    playerName: name,
                                    opponentName: data.name,
                                    peerId: peerId,
                                    roomCode: code
                                };
                                sessionStorage.setItem(GAME_KEY, JSON.stringify(game));

                                conn.send({ type: 'start', hostName: name });
                                showStatus('<span class="success">Opponent joined! Starting game...</span>');

                                setTimeout(() => {
                                    peer.destroy();
                                    window.location.href = 'game.html';
                                }, 1000);
                            }
                        });
                    });
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    showStatus('Room code taken. Try again.', 'error');
                    enableAll();
                } else {
                    showStatus('Connection error: ' + err.type, 'error');
                    enableAll();
                }
            });
        }

        function showJoinSection() {
            const name = document.getElementById('playerName').value.trim();
            if (!name || name.length < 2) {
                showStatus('Enter a name (2+ characters)', 'error');
                return;
            }
            document.getElementById('joinSection').style.display = 'block';
            document.getElementById('mainButtons').style.display = 'none';
            document.getElementById('roomCodeInput').focus();
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();

            if (!code || code.length < 4) {
                showStatus('Enter a valid room code', 'error');
                return;
            }

            disableAll();
            showStatus('<span class="spinner"></span><span class="waiting">Connecting...</span>');

            const hostPeerId = 'eklobby-' + code;
            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(hostPeerId, { reliable: true });

                conn.on('open', () => {
                    conn.send({ type: 'join', name: name });
                    showStatus('<span class="spinner"></span><span class="waiting">Joining game...</span>');

                    conn.on('data', (data) => {
                        if (data.type === 'start') {
                            const game = {
                                role: 'client',
                                playerName: name,
                                opponentName: data.hostName,
                                roomCode: code
                            };
                            sessionStorage.setItem(GAME_KEY, JSON.stringify(game));

                            showStatus('<span class="success">Connected! Starting game...</span>');

                            setTimeout(() => {
                                peer.destroy();
                                window.location.href = 'game.html';
                            }, 1000);
                        }
                    });
                });

                conn.on('error', () => {
                    showStatus('Could not connect. Check the room code.', 'error');
                    enableAll();
                });

                setTimeout(() => {
                    if (!conn.open) {
                        showStatus('Connection timed out. Check the code and try again.', 'error');
                        enableAll();
                    }
                }, 15000);
            });

            peer.on('error', (err) => {
                showStatus('Connection error: ' + err.type, 'error');
                enableAll();
            });
        }

        function showStatus(message, type = '') {
            const s = document.getElementById('status');
            s.innerHTML = message;
            s.className = 'status' + (type ? ' ' + type : '');
        }

        function disableAll() {
            document.querySelectorAll('button, input').forEach(el => el.disabled = true);
        }

        function enableAll() {
            document.querySelectorAll('button, input').forEach(el => el.disabled = false);
        }

        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('mainButtons').querySelector('button').click();
        });

        document.getElementById('roomCodeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>
</html>
