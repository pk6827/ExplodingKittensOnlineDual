<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Kittens - Online Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .waiting-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .waiting-screen.active {
            display: flex;
        }

        .waiting-content {
            text-align: center;
        }

        .waiting-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .waiting-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #667eea;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-board {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 20px;
            margin-bottom: 30px;
        }

        .top-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .player-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .player-section.opponent {
            border-color: #e74c3c;
        }

        .player-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .player-name.opponent {
            color: #e74c3c;
        }

        .player-name.current {
            color: #2ecc71;
        }

        .player-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .player-section.opponent .stat-value {
            color: #e74c3c;
        }

        .decks-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .deck-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #667eea;
        }

        .deck-section.play-pile {
            border-color: #f39c12;
        }

        .pile-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .deck-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            position: relative;
        }

        .deck-card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: absolute;
        }

        .deck-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .draw-deck {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
        }

        .draw-deck::after {
            content: '\ud83d\udee1';
            font-size: 24px;
        }

        .play-pile-card {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: 2px solid #fff;
        }

        .deck-count {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }

        .center-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .turn-indicator {
            font-size: 18px;
            margin-bottom: 15px;
            min-height: 30px;
        }

        .turn-indicator.your-turn {
            color: #2ecc71;
            font-weight: bold;
        }

        .turn-indicator.opponent-turn {
            color: #e74c3c;
            font-weight: bold;
        }

        .game-message {
            font-size: 16px;
            margin: 15px 0;
            min-height: 40px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
        }

        .game-message.info {
            color: #667eea;
            border-left: 4px solid #667eea;
        }

        .game-message.warning {
            color: #f39c12;
            border-left: 4px solid #f39c12;
        }

        .game-message.danger {
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }

        .game-message.success {
            color: #2ecc71;
            border-left: 4px solid #2ecc71;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .draw-btn, .end-turn-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .end-turn-btn {
            background: #667eea;
        }

        .draw-btn:hover:not(:disabled), .end-turn-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .draw-btn:hover:not(:disabled) {
            background: #27ae60;
        }

        .end-turn-btn:hover:not(:disabled) {
            background: #764ba2;
        }

        .draw-btn:disabled, .end-turn-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .playable-cards-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #f39c12;
        }

        .playable-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            font-weight: bold;
            color: #f39c12;
        }

        .playable-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 140px;
            align-items: center;
        }

        .playable-card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .playable-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: #ffd700;
        }

        .playable-card.selected {
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .playable-card.defuse {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .playable-card.skip {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .playable-card.attack {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
        }

        .playable-card.favor {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }

        .playable-card.shuffle {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .playable-card.peek {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        }

        .playable-card.nope {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }

        .playable-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hand-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .hand-label {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.8;
            font-weight: bold;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: #ffd700;
        }

        .card.exploding {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .card.defuse {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .card.skip {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .card.attack {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
        }

        .card.favor {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }

        .card.shuffle {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .card.peek {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        }

        .card.nope {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-message {
            font-size: 14px;
            opacity: 0.6;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over.active {
            display: flex;
        }

        .game-over-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
        }

        .game-over-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #2ecc71;
        }

        .game-over-content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .game-over-content button {
            background: #667eea;
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
        }

        .game-over-content button:hover {
            background: #764ba2;
        }

        @media (max-width: 1024px) {
            .decks-area {
                grid-template-columns: 1fr 1fr;
            }

            .top-area {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .card, .playable-card, .deck-card {
                width: 70px;
                height: 100px;
                font-size: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .decks-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐱 Exploding Kittens - Online Battle</h1>
        </div>

        <div class="game-board">
            <!-- Top Area: Both Players -->
            <div class="top-area">
                <!-- Opponent Section -->
                <div class="player-section opponent">
                    <div class="player-name opponent" id="opponentName">Opponent</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="opponentHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="opponentStatus">Waiting</div>
                        </div>
                    </div>
                </div>

                <!-- You Section -->
                <div class="player-section">
                    <div class="player-name current" id="playerName">You</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="playerHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="playerStatus">Waiting</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Decks Area: Draw Deck and Play Pile -->
            <div class="decks-area">
                <!-- Draw Deck (Face Down) -->
                <div class="deck-section">
                    <div class="pile-label">Draw Pile</div>
                    <div class="deck-visual">
                        <div class="deck-card draw-deck" onclick="drawAndEndTurn()" id="drawDeckBtn" style="cursor: pointer; left: 0;"></div>
                    </div>
                    <div class="deck-count" id="deckCount">0 cards</div>
                </div>

                <!-- Played Pile (Face Up) -->
                <div class="deck-section play-pile">
                    <div class="pile-label">Played Cards</div>
                    <div class="deck-visual">
                        <div class="deck-card play-pile-card" id="playedCard" style="left: 0;">
                            <span id="playedCardType">—</span>
                        </div>
                    </div>
                    <div class="deck-count" id="playedCount">0 cards</div>
                </div>
            </div>

            <!-- Center Display -->
            <div class="center-display">
                <div class="turn-indicator" id="turnIndicator"></div>
                <div class="game-message info" id="gameMessage">Connecting to opponent...</div>
                <div class="action-buttons">
                    <button class="end-turn-btn" id="endTurnBtn" onclick="endPlayerTurn()" disabled>Play & Draw Card</button>
                </div>
            </div>

            <!-- Playable Cards Display -->
            <div class="playable-cards-section">
                <div class="playable-label">🎴 Your Playable Cards (Click to Play)</div>
                <div class="playable-cards" id="playableCards">
                    <div class="empty-message">No cards to play yet</div>
                </div>
            </div>

            <!-- Hand Area -->
            <div class="hand-area">
                <div class="hand-label">Your Full Hand</div>
                <div class="cards" id="playerCards"></div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p id="gameOverMessage"></p>
            <button onclick="goHome()">Return Home</button>
        </div>
    </div>

    <!-- Waiting Screen -->
    <div class="waiting-screen active" id="waitingScreen">
        <div class="waiting-content">
            <h2>🐱 Exploding Kittens</h2>
            <p id="waitingText">Connecting to opponent...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        // ===== Card types =====
        const CARD_TYPES = {
            EXPLODING: 'Exploding Kitten',
            DEFUSE: 'Defuse',
            SKIP: 'Skip',
            ATTACK: 'Attack',
            FAVOR: 'Favor',
            SHUFFLE: 'Shuffle',
            PEEK: 'Peek',
            NOPE: 'Nope'
        };

        // ===== Game info from lobby =====
        const gameInfo = JSON.parse(sessionStorage.getItem('exploding_kittens_game') || '{}');
        const isHost = gameInfo.role === 'host';
        const myName = gameInfo.playerName || 'You';
        const oppName = gameInfo.opponentName || 'Opponent';
        const roomCode = gameInfo.roomCode || '';

        // ===== Local view state (what this player sees) =====
        let viewState = {
            myHand: [],
            opponentHandCount: 0,
            deckCount: 0,
            playedPileCount: 0,
            lastPlayedCard: null,
            isMyTurn: false,
            isAttacked: false,
            cardsToPlay: 1,
            myAlive: true,
            opponentAlive: true,
            gameOver: false,
            message: '',
            messageType: 'info',
            selectedCards: [],
            skipNextDraw: false
        };

        // ===== Host-only: full game state =====
        let hostState = null;
        if (isHost) {
            hostState = {
                deck: [],
                playedPile: [],
                hands: [[], []],       // [host, client]
                names: [myName, oppName],
                alive: [true, true],
                currentTurn: 0,        // 0 = host, 1 = client
                gameOver: false,
                cardsToPlay: [1, 1],
                isAttacked: [false, false],
                skipNextDraw: [false, false]
            };
        }

        // ===== PeerJS connection =====
        let peer = null;
        let conn = null;

        function initConnection() {
            if (!roomCode) {
                document.getElementById('waitingText').textContent = 'No game found. Return to lobby.';
                return;
            }

            const peerId = isHost ? ('ekgame-' + roomCode) : undefined;
            peer = new Peer(peerId);

            peer.on('open', () => {
                if (isHost) {
                    document.getElementById('waitingText').textContent = 'Waiting for opponent to connect...';
                    peer.on('connection', (c) => {
                        conn = c;
                        setupConnection();
                    });
                } else {
                    document.getElementById('waitingText').textContent = 'Connecting to host...';
                    connectToHost(0);
                }
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable' && !isHost) {
                    // Host may not be ready yet, retry
                    document.getElementById('waitingText').textContent = 'Waiting for host... retrying';
                } else {
                    document.getElementById('waitingText').textContent = 'Connection error: ' + err.type;
                }
            });
        }

        function connectToHost(attempt) {
            if (attempt >= 10) {
                document.getElementById('waitingText').textContent = 'Could not reach host. Please try again.';
                return;
            }
            const c = peer.connect('ekgame-' + roomCode, { reliable: true });
            let connected = false;

            c.on('open', () => {
                connected = true;
                conn = c;
                setupConnection_afterOpen();
            });

            c.on('error', () => {
                if (!connected) {
                    setTimeout(() => connectToHost(attempt + 1), 2000);
                }
            });

            // If not connected after 3 seconds, retry
            setTimeout(() => {
                if (!connected && (!c.open)) {
                    try { c.close(); } catch(e) {}
                    connectToHost(attempt + 1);
                }
            }, 3000);
        }

        function setupConnection() {
            conn.on('open', () => {
                if (isHost) {
                    initHostGame();
                } else {
                    conn.send({ type: 'ready' });
                }
            });

            conn.on('data', (data) => {
                handleMessage(data);
            });

            conn.on('close', () => {
                if (!viewState.gameOver) {
                    showMessage('Opponent disconnected!', 'danger');
                }
            });
        }

        function setupConnection_afterOpen() {
            conn.send({ type: 'ready' });

            conn.on('data', (data) => {
                handleMessage(data);
            });

            conn.on('close', () => {
                if (!viewState.gameOver) {
                    showMessage('Opponent disconnected!', 'danger');
                }
            });
        }

        // ===== Host game logic =====
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initHostGame() {
            // Build deck: 1 Exploding Kitten for 2 players
            const deck = [];
            for (let i = 0; i < 1; i++) deck.push({ type: CARD_TYPES.EXPLODING });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.DEFUSE });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SKIP });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.ATTACK });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.FAVOR });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SHUFFLE });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.PEEK });
            for (let i = 0; i < 5; i++) deck.push({ type: CARD_TYPES.NOPE });

            // Separate exploding kittens
            const exploding = deck.filter(c => c.type === CARD_TYPES.EXPLODING);
            let remaining = shuffleArray(deck.filter(c => c.type !== CARD_TYPES.EXPLODING));

            // Give each player 1 defuse + 6 random cards
            hostState.hands[0] = [{ type: CARD_TYPES.DEFUSE }];
            hostState.hands[1] = [{ type: CARD_TYPES.DEFUSE }];

            let defusesRemoved = 0;
            remaining = remaining.filter(c => {
                if (c.type === CARD_TYPES.DEFUSE && defusesRemoved < 2) {
                    defusesRemoved++;
                    return false;
                }
                return true;
            });

            for (let i = 0; i < 6; i++) {
                hostState.hands[0].push(remaining.pop());
                hostState.hands[1].push(remaining.pop());
            }

            // Put exploding kittens back and shuffle
            hostState.deck = shuffleArray([...remaining, ...exploding]);
            hostState.currentTurn = 0;

            // Send initial state to both players
            broadcastState('Game started!', 'info');
        }

        function broadcastState(msg, msgType) {
            // Send to host (self)
            updateLocalView(0, msg, msgType);

            // Send to client
            if (conn && conn.open) {
                conn.send({
                    type: 'state',
                    hand: hostState.hands[1],
                    opponentHandCount: hostState.hands[0].length,
                    deckCount: hostState.deck.length,
                    playedPileCount: hostState.playedPile.length,
                    lastPlayedCard: hostState.playedPile.length > 0 ? hostState.playedPile[hostState.playedPile.length - 1] : null,
                    isMyTurn: hostState.currentTurn === 1,
                    isAttacked: hostState.isAttacked[1],
                    cardsToPlay: hostState.cardsToPlay[1],
                    myAlive: hostState.alive[1],
                    opponentAlive: hostState.alive[0],
                    gameOver: hostState.gameOver,
                    message: msg,
                    messageType: msgType
                });
            }
        }

        function updateLocalView(playerIndex, msg, msgType) {
            const oi = playerIndex === 0 ? 1 : 0;
            viewState.myHand = [...hostState.hands[playerIndex]];
            viewState.opponentHandCount = hostState.hands[oi].length;
            viewState.deckCount = hostState.deck.length;
            viewState.playedPileCount = hostState.playedPile.length;
            viewState.lastPlayedCard = hostState.playedPile.length > 0 ? hostState.playedPile[hostState.playedPile.length - 1] : null;
            viewState.isMyTurn = hostState.currentTurn === playerIndex;
            viewState.isAttacked = hostState.isAttacked[playerIndex];
            viewState.cardsToPlay = hostState.cardsToPlay[playerIndex];
            viewState.myAlive = hostState.alive[playerIndex];
            viewState.opponentAlive = hostState.alive[oi];
            viewState.gameOver = hostState.gameOver;
            viewState.message = msg;
            viewState.messageType = msgType;
            viewState.selectedCards = [];

            document.getElementById('waitingScreen').classList.remove('active');
            updateUI();
        }

        // ===== Handle messages =====
        function handleMessage(data) {
            if (isHost) {
                // Host receives actions from client
                if (data.type === 'ready') {
                    initHostGame();
                } else if (data.type === 'action') {
                    processAction(1, data);
                }
            } else {
                // Client receives state updates from host
                if (data.type === 'state') {
                    viewState.myHand = data.hand;
                    viewState.opponentHandCount = data.opponentHandCount;
                    viewState.deckCount = data.deckCount;
                    viewState.playedPileCount = data.playedPileCount;
                    viewState.lastPlayedCard = data.lastPlayedCard;
                    viewState.isMyTurn = data.isMyTurn;
                    viewState.isAttacked = data.isAttacked;
                    viewState.cardsToPlay = data.cardsToPlay;
                    viewState.myAlive = data.myAlive;
                    viewState.opponentAlive = data.opponentAlive;
                    viewState.gameOver = data.gameOver;
                    viewState.message = data.message;
                    viewState.messageType = data.messageType;
                    viewState.selectedCards = [];

                    document.getElementById('waitingScreen').classList.remove('active');
                    updateUI();

                    if (data.gameOver) {
                        showGameOver(data.myAlive);
                    }
                }
            }
        }

        // ===== Host processes an action from either player =====
        function processAction(playerIndex, action) {
            if (hostState.gameOver) return;
            if (hostState.currentTurn !== playerIndex) return;

            const hand = hostState.hands[playerIndex];
            const otherIndex = playerIndex === 0 ? 1 : 0;
            const pName = hostState.names[playerIndex];
            const oName = hostState.names[otherIndex];

            // Play selected cards
            if (action.selectedCardIndices && action.selectedCardIndices.length > 0) {
                if (hostState.isAttacked[playerIndex] && action.selectedCardIndices.length !== hostState.cardsToPlay[playerIndex]) {
                    broadcastState(`${pName} must play exactly ${hostState.cardsToPlay[playerIndex]} card(s)!`, 'warning');
                    return;
                }

                const sorted = [...action.selectedCardIndices].sort((a, b) => b - a);
                const playedCards = sorted.map(i => hand[i]);

                // Validate indices
                for (const idx of sorted) {
                    if (idx < 0 || idx >= hand.length) return;
                }

                sorted.forEach(i => hand.splice(i, 1));

                let skipDraw = false;
                let pendingAttack = false;

                playedCards.forEach(card => {
                    hostState.playedPile.push(card);

                    if (card.type === CARD_TYPES.ATTACK) {
                        skipDraw = true;
                        pendingAttack = true;
                        broadcastState(`${pName} played ATTACK! ${oName} must play 2 cards!`, 'danger');
                    } else if (card.type === CARD_TYPES.SKIP) {
                        skipDraw = true;
                        broadcastState(`${pName} played SKIP!`, 'info');
                    } else if (card.type === CARD_TYPES.SHUFFLE) {
                        hostState.deck = shuffleArray(hostState.deck);
                        broadcastState(`${pName} played SHUFFLE! Deck reshuffled!`, 'info');
                    } else if (card.type === CARD_TYPES.PEEK) {
                        const top3 = hostState.deck.slice(-3).reverse();
                        const peekMsg = top3.map((c, i) => `${i + 1}. ${c.type}`).join(', ');
                        // Only the playing player sees the peek result
                        if (playerIndex === 0) {
                            updateLocalView(0, `You peeked: ${peekMsg}`, 'info');
                            if (conn && conn.open) {
                                conn.send({
                                    type: 'state',
                                    hand: hostState.hands[1],
                                    opponentHandCount: hostState.hands[0].length,
                                    deckCount: hostState.deck.length,
                                    playedPileCount: hostState.playedPile.length,
                                    lastPlayedCard: hostState.playedPile[hostState.playedPile.length - 1],
                                    isMyTurn: hostState.currentTurn === 1,
                                    isAttacked: hostState.isAttacked[1],
                                    cardsToPlay: hostState.cardsToPlay[1],
                                    myAlive: hostState.alive[1],
                                    opponentAlive: hostState.alive[0],
                                    gameOver: hostState.gameOver,
                                    message: `${pName} peeked at the top cards...`,
                                    messageType: 'info'
                                });
                            }
                        } else {
                            updateLocalView(0, `${pName} peeked at the top cards...`, 'info');
                            if (conn && conn.open) {
                                conn.send({
                                    type: 'state',
                                    hand: hostState.hands[1],
                                    opponentHandCount: hostState.hands[0].length,
                                    deckCount: hostState.deck.length,
                                    playedPileCount: hostState.playedPile.length,
                                    lastPlayedCard: hostState.playedPile[hostState.playedPile.length - 1],
                                    isMyTurn: hostState.currentTurn === 1,
                                    isAttacked: hostState.isAttacked[1],
                                    cardsToPlay: hostState.cardsToPlay[1],
                                    myAlive: hostState.alive[1],
                                    opponentAlive: hostState.alive[0],
                                    gameOver: hostState.gameOver,
                                    message: `You peeked: ${peekMsg}`,
                                    messageType: 'info'
                                });
                            }
                        }
                        return;
                    } else if (card.type === CARD_TYPES.FAVOR) {
                        const otherHand = hostState.hands[otherIndex];
                        if (otherHand.length > 0) {
                            const ri = Math.floor(Math.random() * otherHand.length);
                            const stolen = otherHand.splice(ri, 1)[0];
                            hand.push(stolen);
                            broadcastState(`${pName} played FAVOR and took a card from ${oName}!`, 'info');
                        } else {
                            broadcastState(`${pName} played FAVOR but ${oName} has no cards!`, 'warning');
                        }
                    } else if (card.type === CARD_TYPES.NOPE) {
                        broadcastState(`${pName} played NOPE!`, 'warning');
                    }
                });

                if (skipDraw) {
                    // Switch turn without drawing
                    hostState.currentTurn = otherIndex;
                    hostState.cardsToPlay[playerIndex] = 1;
                    hostState.isAttacked[playerIndex] = false;
                    if (pendingAttack) {
                        hostState.isAttacked[otherIndex] = true;
                        hostState.cardsToPlay[otherIndex] = 2;
                    }
                    broadcastState(viewState.message, viewState.messageType);
                    return;
                }
            }

            // Draw a card
            if (hostState.deck.length === 0) {
                hostState.gameOver = true;
                broadcastState(`Deck is empty! ${pName} survives!`, 'success');
                if (playerIndex === 0) showGameOver(true);
                else showGameOver(false);
                return;
            }

            const drawn = hostState.deck.pop();
            hand.push(drawn);

            if (drawn.type === CARD_TYPES.EXPLODING) {
                const defIdx = hand.findIndex(c => c.type === CARD_TYPES.DEFUSE);
                if (defIdx !== -1) {
                    hand.splice(defIdx, 1);
                    const expIdx = hand.indexOf(drawn);
                    hand.splice(expIdx, 1);
                    const insertAt = Math.floor(Math.random() * (hostState.deck.length + 1));
                    hostState.deck.splice(insertAt, 0, drawn);

                    hostState.currentTurn = otherIndex;
                    hostState.cardsToPlay[playerIndex] = 1;
                    hostState.isAttacked[playerIndex] = false;
                    broadcastState(`${pName} drew an Exploding Kitten but used a Defuse!`, 'warning');
                } else {
                    hostState.alive[playerIndex] = false;
                    hostState.gameOver = true;
                    broadcastState(`${pName} drew an Exploding Kitten and EXPLODED!`, 'danger');

                    if (playerIndex === 0) showGameOver(false);
                    else showGameOver(true);
                }
            } else {
                hostState.currentTurn = otherIndex;
                hostState.cardsToPlay[playerIndex] = 1;
                hostState.isAttacked[playerIndex] = false;
                broadcastState(`${pName} drew a card`, 'info');
            }
        }

        // ===== Player UI actions =====
        function toggleCardSelection(index) {
            if (!viewState.isMyTurn || viewState.gameOver) return;

            const card = viewState.myHand[index];
            if (!card || card.type === CARD_TYPES.EXPLODING) return;
            if (card.type === CARD_TYPES.DEFUSE && !viewState.myHand.some(c => c.type === CARD_TYPES.EXPLODING)) return;

            const si = viewState.selectedCards.indexOf(index);
            if (si > -1) {
                viewState.selectedCards.splice(si, 1);
            } else {
                if (viewState.selectedCards.length < viewState.cardsToPlay) {
                    viewState.selectedCards.push(index);
                }
            }
            updateUI();
        }

        function endPlayerTurn() {
            if (!viewState.isMyTurn || viewState.gameOver) return;

            if (viewState.isAttacked && viewState.selectedCards.length > 0 && viewState.selectedCards.length !== viewState.cardsToPlay) {
                showMessage(`Select exactly ${viewState.cardsToPlay} card(s) to play!`, 'warning');
                return;
            }

            if (isHost) {
                processAction(0, { selectedCardIndices: [...viewState.selectedCards] });
            } else {
                conn.send({
                    type: 'action',
                    selectedCardIndices: [...viewState.selectedCards]
                });
            }
            viewState.selectedCards = [];
        }

        function drawAndEndTurn() {
            endPlayerTurn();
        }

        // ===== UI rendering =====
        function getCardClass(cardType) {
            switch(cardType) {
                case CARD_TYPES.EXPLODING: return 'exploding';
                case CARD_TYPES.DEFUSE: return 'defuse';
                case CARD_TYPES.SKIP: return 'skip';
                case CARD_TYPES.ATTACK: return 'attack';
                case CARD_TYPES.FAVOR: return 'favor';
                case CARD_TYPES.SHUFFLE: return 'shuffle';
                case CARD_TYPES.PEEK: return 'peek';
                case CARD_TYPES.NOPE: return 'nope';
                default: return '';
            }
        }

        function getCardEmoji(cardType) {
            switch(cardType) {
                case CARD_TYPES.EXPLODING: return '\ud83d\udca3';
                case CARD_TYPES.DEFUSE: return '\ud83e\uddef';
                case CARD_TYPES.SKIP: return '\u23ed\ufe0f';
                case CARD_TYPES.ATTACK: return '\u2694\ufe0f';
                case CARD_TYPES.FAVOR: return '\ud83d\ude4f';
                case CARD_TYPES.SHUFFLE: return '\ud83d\udd00';
                case CARD_TYPES.PEEK: return '\ud83d\udc40';
                case CARD_TYPES.NOPE: return '\ud83d\udeab';
                default: return '\ud83c\udfb4';
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('gameMessage');
            el.textContent = text;
            el.className = 'game-message ' + type;
        }

        function showGameOver(iWon) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('gameOverTitle');
            const msg = document.getElementById('gameOverMessage');

            if (iWon) {
                title.textContent = '\ud83c\udf89 You Win!';
                msg.textContent = `You survived the Exploding Kittens and defeated ${oppName}!`;
            } else {
                title.textContent = '\ud83d\udc80 Game Over';
                msg.textContent = `${oppName} has won! Better luck next time!`;
            }
            modal.classList.add('active');
        }

        function goHome() {
            sessionStorage.removeItem('exploding_kittens_game');
            if (peer) peer.destroy();
            window.location.href = 'onlineconnecter.html';
        }

        function getPlayableCards() {
            const playable = [];
            viewState.myHand.forEach((card, index) => {
                if (card.type === CARD_TYPES.EXPLODING) return;
                if (card.type === CARD_TYPES.DEFUSE && !viewState.myHand.some(c => c.type === CARD_TYPES.EXPLODING)) return;
                playable.push({ card, index });
            });
            return playable;
        }

        function updateUI() {
            document.getElementById('playerName').textContent = myName;
            document.getElementById('opponentName').textContent = oppName;

            document.getElementById('playerHandCount').textContent = viewState.myHand.length;
            document.getElementById('opponentHandCount').textContent = viewState.opponentHandCount;
            document.getElementById('deckCount').textContent = viewState.deckCount + ' cards';
            document.getElementById('playedCount').textContent = viewState.playedPileCount + ' cards';

            document.getElementById('playerStatus').textContent = viewState.myAlive ? 'Alive' : 'Dead';
            document.getElementById('opponentStatus').textContent = viewState.opponentAlive ? 'Alive' : 'Dead';

            if (viewState.lastPlayedCard) {
                document.getElementById('playedCardType').textContent = getCardEmoji(viewState.lastPlayedCard.type);
            }

            // Turn indicator
            const ti = document.getElementById('turnIndicator');
            if (viewState.isMyTurn) {
                if (viewState.isAttacked) {
                    ti.textContent = '\u2694\ufe0f YOU ARE ATTACKED! Must play ' + viewState.cardsToPlay + ' cards, then draw!';
                } else {
                    ti.textContent = '\u2705 Your Turn \u2014 Select cards (optional), then click Play & Draw!';
                }
                ti.className = 'turn-indicator your-turn';
            } else {
                ti.textContent = '\u23f3 ' + oppName + '\'s Turn';
                ti.className = 'turn-indicator opponent-turn';
            }

            // Message
            if (viewState.message) {
                showMessage(viewState.message, viewState.messageType);
            }

            // Button
            document.getElementById('endTurnBtn').disabled = !viewState.isMyTurn || viewState.gameOver;

            // Playable cards
            const playableDiv = document.getElementById('playableCards');
            const playable = getPlayableCards();

            if (!viewState.isMyTurn || playable.length === 0) {
                playableDiv.innerHTML = '<div class="empty-message">' + (viewState.isMyTurn ? 'No playable cards. Just draw.' : 'Wait for your turn.') + '</div>';
            } else {
                playableDiv.innerHTML = '';
                playable.forEach(({ card, index }) => {
                    const div = document.createElement('div');
                    div.className = 'playable-card ' + getCardClass(card.type);
                    if (viewState.selectedCards.includes(index)) div.classList.add('selected');
                    div.textContent = getCardEmoji(card.type) + '\n' + card.type.substring(0, 8);
                    div.onclick = () => toggleCardSelection(index);
                    if (viewState.gameOver) { div.classList.add('disabled'); div.onclick = null; }
                    playableDiv.appendChild(div);
                });
            }

            // Player hand
            const handDiv = document.getElementById('playerCards');
            handDiv.innerHTML = '';
            viewState.myHand.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card ' + getCardClass(card.type);
                div.textContent = getCardEmoji(card.type) + '\n' + card.type.substring(0, 8);
                if (card.type === CARD_TYPES.EXPLODING || !viewState.isMyTurn) {
                    div.classList.add('disabled');
                }
                handDiv.appendChild(div);
            });

            // Game over check
            if (viewState.gameOver && !document.getElementById('gameOverModal').classList.contains('active')) {
                showGameOver(viewState.myAlive);
            }
        }

        // ===== Start =====
        window.addEventListener('load', initConnection);
    </script>
</body>
</html>
