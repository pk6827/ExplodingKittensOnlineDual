<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Kittens - Real Multiplayer Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .waiting-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .waiting-screen.active {
            display: flex;
        }

        .waiting-content {
            text-align: center;
        }

        .waiting-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .waiting-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #667eea;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-board {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            margin-bottom: 30px;
        }

        .top-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .player-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .player-section.opponent {
            border-color: #e74c3c;
        }

        .player-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .player-name.opponent {
            color: #e74c3c;
        }

        .player-name.current {
            color: #2ecc71;
        }

        .player-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .player-section.opponent .stat-value {
            color: #e74c3c;
        }

        .middle-area {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            align-items: center;
        }

        .card-pile {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #667eea;
        }

        .pile-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .pile-count {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .played-pile {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #f39c12;
        }

        .played-pile-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .played-pile-count {
            font-size: 32px;
            font-weight: bold;
            color: #f39c12;
        }

        .center-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .turn-indicator {
            font-size: 18px;
            margin-bottom: 15px;
            min-height: 30px;
        }

        .turn-indicator.your-turn {
            color: #2ecc71;
            font-weight: bold;
        }

        .turn-indicator.opponent-turn {
            color: #e74c3c;
            font-weight: bold;
        }

        .game-message {
            font-size: 16px;
            margin: 15px 0;
            min-height: 40px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
        }

        .game-message.info {
            color: #667eea;
            border-left: 4px solid #667eea;
        }

        .game-message.warning {
            color: #f39c12;
            border-left: 4px solid #f39c12;
        }

        .game-message.danger {
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }

        .game-message.success {
            color: #2ecc71;
            border-left: 4px solid #2ecc71;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .draw-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .draw-btn:hover:not(:disabled) {
            background: #27ae60;
            transform: scale(1.05);
        }

        .draw-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .bottom-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .hand-label {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .card {
            width: 80px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card.exploding {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .card.defuse {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .card.action {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .reset-btn:hover {
            background: #764ba2;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over.active {
            display: flex;
        }

        .game-over-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
        }

        .game-over-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #2ecc71;
        }

        .game-over-content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .game-over-content button {
            background: #667eea;
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
        }

        .game-over-content button:hover {
            background: #764ba2;
        }

        @media (max-width: 1024px) {
            .middle-area {
                grid-template-columns: 1fr;
            }

            .top-area {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .card {
                width: 70px;
                height: 90px;
                font-size: 10px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐱 Exploding Kittens - Multiplayer Battle</h1>
        </div>

        <div class="game-board">
            <!-- Top Area: Both Players -->
            <div class="top-area">
                <!-- Opponent Section -->
                <div class="player-section opponent">
                    <div class="player-name opponent" id="opponentName">Waiting for opponent...</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="opponentHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="opponentStatus">Waiting</div>
                        </div>
                    </div>
                </div>

                <!-- You Section -->
                <div class="player-section">
                    <div class="player-name current" id="playerName">You</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="playerHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="playerStatus">Waiting</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Area: Card Piles and Messages -->
            <div class="middle-area">
                <!-- Draw Pile -->
                <div class="card-pile">
                    <div class="pile-label">Draw Pile</div>
                    <div class="pile-count" id="deckCount">0</div>
                </div>

                <!-- Center Display -->
                <div class="center-display">
                    <div class="turn-indicator" id="turnIndicator"></div>
                    <div class="game-message info" id="gameMessage">Waiting for players...</div>
                    <div class="action-buttons">
                        <button class="draw-btn" id="drawBtn" onclick="playerDrawCard()" disabled>Draw Card</button>
                    </div>
                </div>

                <!-- Played Pile -->
                <div class="played-pile">
                    <div class="played-pile-label">Played Cards</div>
                    <div class="played-pile-count" id="playedCount">0</div>
                </div>
            </div>

            <!-- Bottom Area: Player's Hand -->
            <div class="bottom-area">
                <div class="hand-label">Your Hand</div>
                <div class="cards" id="playerCards"></div>
                <button class="reset-btn" onclick="goHome()">Exit Game</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p id="gameOverMessage"></p>
            <button onclick="goHome()">Return Home</button>
        </div>
    </div>

    <!-- Waiting Screen -->
    <div class="waiting-screen active" id="waitingScreen">
        <div class="waiting-content">
            <h2>🐱 Exploding Kittens</h2>
            <p id="waitingText">Waiting for opponent to connect...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Card types
        const CARD_TYPES = {
            EXPLODING: 'Exploding Kitten',
            DEFUSE: 'Defuse',
            SKIP: 'Skip',
            ATTACK: 'Attack',
            FAVOR: 'Favor',
            SHUFFLE: 'Shuffle',
            PEEK: 'Peek',
            NOPE: 'Nope'
        };

        // Game state
        let gameState = {
            deck: [],
            playedPile: [],
            playerHand: [],
            opponentHand: [],
            currentPlayer: null, // 'player' or 'opponent'
            gameOver: false,
            playerName: '',
            opponentName: '',
            playerAlive: true,
            opponentAlive: true,
            ready: false
        };

        let gameId = '';
        let isPlayer1 = false;

        // Initialize game
        function initGame() {
            // Get game info from localStorage
            const game = JSON.parse(localStorage.getItem('exploding_kittens_game') || '{}');
            gameId = game.id || '';
            gameState.playerName = game.player1 || '';
            gameState.opponentName = game.player2 || '';
            isPlayer1 = game.player1 === gameState.playerName;

            // Update names in UI
            document.getElementById('playerName').textContent = gameState.playerName || 'You';
            document.getElementById('opponentName').textContent = gameState.opponentName || 'Opponent';

            // Create and shuffle deck
            gameState.deck = createDeck();

            // Deal starting cards (6 cards to each player, no exploding kittens)
            dealStartingCards();

            gameState.currentPlayer = 'player';
            gameState.ready = true;

            // Hide waiting screen
            document.getElementById('waitingScreen').classList.remove('active');

            updateUI();
        }

        // Create deck
        function createDeck() {
            const deck = [];
            
            // 4 Exploding Kittens
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.EXPLODING });
            
            // 4 Defuses (2 extra for starting hands)
            for (let i = 0; i < 6; i++) deck.push({ type: CARD_TYPES.DEFUSE });
            
            // 4 Skips
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SKIP });
            
            // 4 Attacks
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.ATTACK });
            
            // 4 Favors
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.FAVOR });
            
            // 4 Shuffles
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SHUFFLE });
            
            // 4 Peeks
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.PEEK });

            // 4 Nopes
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.NOPE });

            return shuffleArray(deck);
        }

        // Deal starting cards (no exploding kittens)
        function dealStartingCards() {
            let playerCard = drawFromDeck();
            let opponentCard = drawFromDeck();

            // Ensure no exploding kittens in starting hand
            while (playerCard && playerCard.type === CARD_TYPES.EXPLODING) {
                gameState.playedPile.push(playerCard);
                playerCard = drawFromDeck();
            }
            while (opponentCard && opponentCard.type === CARD_TYPES.EXPLODING) {
                gameState.playedPile.push(opponentCard);
                opponentCard = drawFromDeck();
            }

            gameState.playerHand.push(playerCard);
            gameState.opponentHand.push(opponentCard);

            // Deal 5 more cards to each
            for (let i = 0; i < 5; i++) {
                let card = drawFromDeck();
                while (card && card.type === CARD_TYPES.EXPLODING) {
                    gameState.playedPile.push(card);
                    card = drawFromDeck();
                }
                gameState.playerHand.push(card);

                card = drawFromDeck();
                while (card && card.type === CARD_TYPES.EXPLODING) {
                    gameState.playedPile.push(card);
                    card = drawFromDeck();
                }
                gameState.opponentHand.push(card);
            }

            // Give each player 1 defuse
            gameState.playerHand.push({ type: CARD_TYPES.DEFUSE });
            gameState.opponentHand.push({ type: CARD_TYPES.DEFUSE });
        }

        // Draw from deck
        function drawFromDeck() {
            if (gameState.deck.length === 0) {
                showMessage('Deck is empty! You survive!', 'success');
                return null;
            }
            return gameState.deck.pop();
        }

        // Shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Player draws card
        function playerDrawCard() {
            if (!gameState.ready || gameState.gameOver || gameState.currentPlayer !== 'player') return;

            const card = drawFromDeck();

            if (!card) {
                showMessage('Deck is empty! You win by surviving!', 'success');
                endGame('player');
                return;
            }

            gameState.playerHand.push(card);

            // Handle exploding kitten
            if (card.type === CARD_TYPES.EXPLODING) {
                const defuseIndex = gameState.playerHand.findIndex(c => c.type === CARD_TYPES.DEFUSE);
                
                if (defuseIndex !== -1) {
                    showMessage('💣 You drew an Exploding Kitten! Using Defuse...', 'warning');
                    gameState.playerHand.splice(defuseIndex, 1);
                    const explosiveIndex = gameState.playerHand.indexOf(card);
                    gameState.playerHand.splice(explosiveIndex, 1);
                    gameState.playedPile.push(card);
                } else {
                    showMessage('💣 Exploding Kitten! No Defuse! Game Over!', 'danger');
                    gameState.playerAlive = false;
                    endGame('opponent');
                    return;
                }
            }

            showMessage(`Drew ${card.type}`, 'info');
            gameState.currentPlayer = 'opponent';
            updateUI();

            // Opponent takes turn after delay
            setTimeout(() => {
                opponentDrawCard();
            }, 2000);
        }

        // Opponent draws card (AI)
        function opponentDrawCard() {
            if (gameState.gameOver) return;

            const card = drawFromDeck();

            if (!card) {
                showMessage('Deck is empty! Opponent runs out of cards!', 'success');
                endGame('player');
                return;
            }

            gameState.opponentHand.push(card);

            // Handle exploding kitten
            if (card.type === CARD_TYPES.EXPLODING) {
                const defuseIndex = gameState.opponentHand.findIndex(c => c.type === CARD_TYPES.DEFUSE);
                
                if (defuseIndex !== -1) {
                    showMessage('💣 Opponent drew an Exploding Kitten! Using Defuse...', 'warning');
                    gameState.opponentHand.splice(defuseIndex, 1);
                    const explosiveIndex = gameState.opponentHand.indexOf(card);
                    gameState.opponentHand.splice(explosiveIndex, 1);
                    gameState.playedPile.push(card);
                } else {
                    showMessage('💣 Opponent drew an Exploding Kitten! No Defuse!', 'success');
                    gameState.opponentAlive = false;
                    endGame('player');
                    return;
                }
            }

            showMessage(`Opponent drew a card...`, 'warning');
            gameState.currentPlayer = 'player';
            updateUI();
        }

        // End game
        function endGame(winner) {
            gameState.gameOver = true;
            const winnerName = winner === 'player' ? gameState.playerName : gameState.opponentName;
            showGameOver(winnerName, winner === 'player');
        }

        // Show game over
        function showGameOver(winner, playerWon) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('gameOverTitle');
            const message = document.getElementById('gameOverMessage');
            
            if (playerWon) {
                title.textContent = `🎉 You Win!`;
                message.textContent = `Congratulations! You survived the Exploding Kittens and defeated ${gameState.opponentName}!`;
            } else {
                title.textContent = `💀 Game Over`;
                message.textContent = `${winner} has won! Better luck next time!`;
            }
            
            modal.classList.add('active');
        }

        // Go home
        function goHome() {
            localStorage.removeItem('exploding_kittens_game');
            window.location.href = 'onlineconnecter.html';
        }

        // Show message
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('gameMessage');
            messageDiv.textContent = text;
            messageDiv.className = 'game-message ' + type;
        }

        // Update UI
        function updateUI() {
            // Update hand counts
            document.getElementById('playerHandCount').textContent = gameState.playerHand.length;
            document.getElementById('opponentHandCount').textContent = gameState.opponentHand.length;

            // Update deck count
            document.getElementById('deckCount').textContent = gameState.deck.length;

            // Update played pile count
            document.getElementById('playedCount').textContent = gameState.playedPile.length;

            // Update player status
            document.getElementById('playerStatus').textContent = gameState.playerAlive ? 'Alive ✓' : 'Dead ✗';
            document.getElementById('opponentStatus').textContent = gameState.opponentAlive ? 'Alive ✓' : 'Dead ✗';

            // Update turn indicator
            const turnIndicator = document.getElementById('turnIndicator');
            if (gameState.currentPlayer === 'player') {
                turnIndicator.textContent = '🎮 Your Turn';
                turnIndicator.className = 'turn-indicator your-turn';
            } else {
                turnIndicator.textContent = '⏳ Opponent\'s Turn';
                turnIndicator.className = 'turn-indicator opponent-turn';
            }

            // Update draw button
            const drawBtn = document.getElementById('drawBtn');
            drawBtn.disabled = gameState.currentPlayer !== 'player' || gameState.gameOver;

            // Display player's hand
            const playerCardsDiv = document.getElementById('playerCards');
            playerCardsDiv.innerHTML = gameState.playerHand.map((card, index) => {
                let cardClass = 'card';
                if (card.type === CARD_TYPES.EXPLODING) cardClass += ' exploding';
                if (card.type === CARD_TYPES.DEFUSE) cardClass += ' defuse';
                if (card.type !== CARD_TYPES.EXPLODING && card.type !== CARD_TYPES.DEFUSE) cardClass += ' action';
                
                return `<div class="${cardClass}">${card.type}</div>`;
            }).join('');
        }

        // Start game when ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                initGame();
            }, 1000);
        });
    </script>
</body>
</html>
