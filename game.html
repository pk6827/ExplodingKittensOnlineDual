<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Kittens - Real Multiplayer Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .waiting-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .waiting-screen.active {
            display: flex;
        }

        .waiting-content {
            text-align: center;
        }

        .waiting-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .waiting-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #667eea;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-board {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 20px;
            margin-bottom: 30px;
        }

        .top-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .player-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .player-section.opponent {
            border-color: #e74c3c;
        }

        .player-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .player-name.opponent {
            color: #e74c3c;
        }

        .player-name.current {
            color: #2ecc71;
        }

        .player-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .player-section.opponent .stat-value {
            color: #e74c3c;
        }

        .decks-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .deck-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #667eea;
        }

        .deck-section.play-pile {
            border-color: #f39c12;
        }

        .pile-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .deck-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            position: relative;
        }

        .deck-card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: absolute;
        }

        .deck-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .draw-deck {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
        }

        .draw-deck::after {
            content: '🔰';
            font-size: 24px;
        }

        .play-pile-card {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: 2px solid #fff;
        }

        .deck-count {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }

        .center-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .turn-indicator {
            font-size: 18px;
            margin-bottom: 15px;
            min-height: 30px;
        }

        .turn-indicator.your-turn {
            color: #2ecc71;
            font-weight: bold;
        }

        .turn-indicator.opponent-turn {
            color: #e74c3c;
            font-weight: bold;
        }

        .game-message {
            font-size: 16px;
            margin: 15px 0;
            min-height: 40px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
        }

        .game-message.info {
            color: #667eea;
            border-left: 4px solid #667eea;
        }

        .game-message.warning {
            color: #f39c12;
            border-left: 4px solid #f39c12;
        }

        .game-message.danger {
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }

        .game-message.success {
            color: #2ecc71;
            border-left: 4px solid #2ecc71;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .draw-btn, .end-turn-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .end-turn-btn {
            background: #667eea;
        }

        .draw-btn:hover:not(:disabled), .end-turn-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .draw-btn:hover:not(:disabled) {
            background: #27ae60;
        }

        .end-turn-btn:hover:not(:disabled) {
            background: #764ba2;
        }

        .draw-btn:disabled, .end-turn-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .playable-cards-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #f39c12;
        }

        .playable-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            font-weight: bold;
            color: #f39c12;
        }

        .playable-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 140px;
            align-items: center;
        }

        .playable-card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .playable-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: #ffd700;
        }

        .playable-card.selected {
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .playable-card.defuse {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .playable-card.skip {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .playable-card.attack {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
        }

        .playable-card.favor {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }

        .playable-card.shuffle {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .playable-card.peek {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        }

        .playable-card.nope {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }

        .playable-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hand-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .hand-label {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.8;
            font-weight: bold;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .card {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: #ffd700;
        }

        .card.exploding {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .card.defuse {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .card.skip {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .card.attack {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
        }

        .card.favor {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }

        .card.shuffle {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .card.peek {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        }

        .card.nope {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .card.selected {
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .empty-message {
            font-size: 14px;
            opacity: 0.6;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over.active {
            display: flex;
        }

        .game-over-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
        }

        .game-over-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #2ecc71;
        }

        .game-over-content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .game-over-content button {
            background: #667eea;
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
        }

        .game-over-content button:hover {
            background: #764ba2;
        }

        @media (max-width: 1024px) {
            .decks-area {
                grid-template-columns: 1fr 1fr;
            }

            .top-area {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .card, .playable-card, .deck-card {
                width: 70px;
                height: 100px;
                font-size: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .decks-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐱 Exploding Kittens - Multiplayer Battle</h1>
        </div>

        <div class="game-board">
            <!-- Top Area: Both Players -->
            <div class="top-area">
                <!-- Opponent Section -->
                <div class="player-section opponent">
                    <div class="player-name opponent" id="opponentName">Waiting for opponent...</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="opponentHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="opponentStatus">Waiting</div>
                        </div>
                    </div>
                </div>

                <!-- You Section -->
                <div class="player-section">
                    <div class="player-name current" id="playerName">You</div>
                    <div class="player-stats">
                        <div class="stat">
                            <div class="stat-label">Hand</div>
                            <div class="stat-value" id="playerHandCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Status</div>
                            <div class="stat-value" id="playerStatus">Waiting</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Decks Area: Draw Deck and Play Pile -->
            <div class="decks-area">
                <!-- Draw Deck (Face Down) -->
                <div class="deck-section">
                    <div class="pile-label">Draw Pile</div>
                    <div class="deck-visual">
                        <div class="deck-card draw-deck" onclick="drawAndEndTurn()" id="drawDeckBtn" style="cursor: pointer; left: 0;"></div>
                    </div>
                    <div class="deck-count" id="deckCount">0 cards</div>
                </div>

                <!-- Played Pile (Face Up) -->
                <div class="deck-section play-pile">
                    <div class="pile-label">Played Cards</div>
                    <div class="deck-visual">
                        <div class="deck-card play-pile-card" id="playedCard" style="left: 0;">
                            <span id="playedCardType">—</span>
                        </div>
                    </div>
                    <div class="deck-count" id="playedCount">0 cards</div>
                </div>
            </div>

            <!-- Center Display -->
            <div class="center-display">
                <div class="turn-indicator" id="turnIndicator"></div>
                <div class="game-message info" id="gameMessage">Waiting for players...</div>
                <div class="action-buttons">
                    <button class="end-turn-btn" id="playCardBtn" onclick="playSelectedCards()" disabled>Play Card</button>
                    <button class="draw-btn" id="drawCardBtn" onclick="drawAndEndTurn()" disabled>Draw Card</button>
                </div>
            </div>

            <!-- Hand Area -->
            <div class="hand-area">
                <div class="hand-label">Your Hand</div>
                <div class="cards" id="playerCards"></div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over" id="gameOverModal">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p id="gameOverMessage"></p>
            <button onclick="goHome()">Return Home</button>
        </div>
    </div>

    <!-- Waiting Screen -->
    <div class="waiting-screen active" id="waitingScreen">
        <div class="waiting-content">
            <h2>🐱 Exploding Kittens</h2>
            <p id="waitingText">Waiting for opponent to connect...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const CARD_TYPES = {
            EXPLODING: 'Exploding Kitten',
            DEFUSE: 'Defuse',
            SKIP: 'Skip',
            ATTACK: 'Attack',
            FAVOR: 'Favor',
            SHUFFLE: 'Shuffle',
            PEEK: 'Peek',
            NOPE: 'Nope'
        };

        const GAME_STATE_KEY = 'exploding_kittens_gamestate';
        const GAME_META_KEY = 'exploding_kittens_game';

        let myPlayerNum = null;
        let selectedCardIndex = null;
        let localPeekMessage = null;

        function initGame() {
            const params = new URLSearchParams(window.location.search);
            myPlayerNum = parseInt(params.get('player'));

            if (myPlayerNum !== 1 && myPlayerNum !== 2) {
                document.getElementById('waitingText').textContent = 'Invalid game link. Return to lobby.';
                return;
            }

            const meta = JSON.parse(localStorage.getItem(GAME_META_KEY) || '{}');
            const myName = myPlayerNum === 1 ? meta.player1 : meta.player2;
            const opponentName = myPlayerNum === 1 ? meta.player2 : meta.player1;
            document.getElementById('playerName').textContent = myName || 'You';
            document.getElementById('opponentName').textContent = opponentName || 'Opponent';

            let state = readGameState();

            if (!state || !state.initialized) {
                if (myPlayerNum === 1) {
                    state = createInitialGameState(meta);
                    writeGameState(state);
                    document.getElementById('waitingScreen').classList.remove('active');
                    renderUI(state);
                } else {
                    document.getElementById('waitingText').textContent = 'Waiting for game to initialize...';
                    const interval = setInterval(() => {
                        state = readGameState();
                        if (state && state.initialized) {
                            clearInterval(interval);
                            document.getElementById('waitingScreen').classList.remove('active');
                            renderUI(state);
                        }
                    }, 500);
                }
            } else {
                document.getElementById('waitingScreen').classList.remove('active');
                renderUI(state);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === GAME_STATE_KEY) {
                    const newState = readGameState();
                    if (newState) {
                        selectedCardIndex = null;
                        localPeekMessage = null;
                        renderUI(newState);
                    }
                }
            });
        }

        function readGameState() {
            try { return JSON.parse(localStorage.getItem(GAME_STATE_KEY)); }
            catch { return null; }
        }

        function writeGameState(state) {
            localStorage.setItem(GAME_STATE_KEY, JSON.stringify(state));
        }

        function createInitialGameState(meta) {
            const deck = createDeck();
            const explodingCards = deck.filter(c => c.type === CARD_TYPES.EXPLODING);
            const nonExploding = shuffleArray(deck.filter(c => c.type !== CARD_TYPES.EXPLODING));

            const player1Hand = [{ type: CARD_TYPES.DEFUSE }];
            const player2Hand = [{ type: CARD_TYPES.DEFUSE }];

            let defusesRemoved = 0;
            const pool = nonExploding.filter(c => {
                if (c.type === CARD_TYPES.DEFUSE && defusesRemoved < 2) {
                    defusesRemoved++;
                    return false;
                }
                return true;
            });

            for (let i = 0; i < 6; i++) {
                player1Hand.push(pool.pop());
                player2Hand.push(pool.pop());
            }

            return {
                deck: shuffleArray([...pool, ...explodingCards]),
                playedPile: [],
                player1Hand,
                player2Hand,
                currentPlayer: 1,
                turnsRemaining: 1,
                gameOver: false,
                winner: null,
                player1Name: meta.player1 || 'Player 1',
                player2Name: meta.player2 || 'Player 2',
                player1Alive: true,
                player2Alive: true,
                message: 'Game started! Player 1 goes first.',
                messageType: 'info',
                initialized: true
            };
        }

        function createDeck() {
            const deck = [];
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.EXPLODING });
            for (let i = 0; i < 6; i++) deck.push({ type: CARD_TYPES.DEFUSE });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SKIP });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.ATTACK });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.FAVOR });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.SHUFFLE });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.PEEK });
            for (let i = 0; i < 4; i++) deck.push({ type: CARD_TYPES.NOPE });
            return shuffleArray(deck);
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getMyHand(state) {
            return myPlayerNum === 1 ? state.player1Hand : state.player2Hand;
        }
        function getOpponentHand(state) {
            return myPlayerNum === 1 ? state.player2Hand : state.player1Hand;
        }
        function setMyHand(state, hand) {
            if (myPlayerNum === 1) state.player1Hand = hand;
            else state.player2Hand = hand;
        }
        function setOpponentHand(state, hand) {
            if (myPlayerNum === 1) state.player2Hand = hand;
            else state.player1Hand = hand;
        }
        function getMyName(state) {
            return myPlayerNum === 1 ? state.player1Name : state.player2Name;
        }
        function getOpponentName(state) {
            return myPlayerNum === 1 ? state.player2Name : state.player1Name;
        }
        function isMyTurn(state) {
            return state.currentPlayer === myPlayerNum && !state.gameOver;
        }

        function selectCard(index) {
            const state = readGameState();
            if (!isMyTurn(state)) return;
            const hand = getMyHand(state);
            const card = hand[index];
            if (!card || card.type === CARD_TYPES.EXPLODING) return;
            if (card.type === CARD_TYPES.DEFUSE && !hand.some(c => c.type === CARD_TYPES.EXPLODING)) return;
            selectedCardIndex = selectedCardIndex === index ? null : index;
            renderUI(state);
        }

        function playSelectedCards() {
            if (selectedCardIndex === null) return;
            const state = readGameState();
            if (!isMyTurn(state)) return;

            const myHand = getMyHand(state);
            const card = myHand[selectedCardIndex];
            if (!card) return;

            myHand.splice(selectedCardIndex, 1);
            state.playedPile.push(card);

            const effect = executeCardEffect(card.type, state);
            selectedCardIndex = null;

            const opponentNum = myPlayerNum === 1 ? 2 : 1;

            if (effect === 'attack') {
                state.currentPlayer = opponentNum;
                state.turnsRemaining = 2;
                state.message = `${getMyName(state)} played ATTACK! ${getOpponentName(state)} must take 2 turns!`;
                state.messageType = 'danger';
            } else if (effect === 'skip') {
                state.turnsRemaining--;
                if (state.turnsRemaining > 0) {
                    state.message = `${getMyName(state)} played SKIP! Skipped one draw, still has turns remaining!`;
                    state.messageType = 'info';
                } else {
                    state.currentPlayer = opponentNum;
                    state.turnsRemaining = 1;
                    state.message = `${getMyName(state)} played SKIP! Turn ended without drawing!`;
                    state.messageType = 'info';
                }
            } else if (effect === 'shuffle') {
                state.message = `${getMyName(state)} played SHUFFLE! Deck reshuffled!`;
                state.messageType = 'info';
            } else if (effect === 'peek') {
                state.message = `${getMyName(state)} played See the Future`;
                state.messageType = 'info';
            } else if (effect === 'favor') {
                state.message = `${getMyName(state)} played FAVOR!`;
                state.messageType = 'success';
            } else {
                state.message = `${getMyName(state)} played ${card.type}`;
                state.messageType = 'success';
            }

            setMyHand(state, myHand);
            writeGameState(state);
            renderUI(state);
        }

        function executeCardEffect(cardType, state) {
            if (cardType === CARD_TYPES.ATTACK) return 'attack';
            if (cardType === CARD_TYPES.SKIP) return 'skip';

            if (cardType === CARD_TYPES.SHUFFLE) {
                state.deck = shuffleArray(state.deck);
                return 'shuffle';
            }

            if (cardType === CARD_TYPES.PEEK) {
                const topCards = state.deck.slice(-Math.min(3, state.deck.length)).reverse();
                if (topCards.length > 0) {
                    const names = topCards.map((c, i) => `${i + 1}. ${c.type}`).join(' | ');
                    localPeekMessage = `Top ${topCards.length} cards: ${names}`;
                } else {
                    localPeekMessage = 'The deck is empty!';
                }
                return 'peek';
            }

            if (cardType === CARD_TYPES.FAVOR) {
                const opponentHand = getOpponentHand(state);
                const myHand = getMyHand(state);
                if (opponentHand.length > 0) {
                    const randIdx = Math.floor(Math.random() * opponentHand.length);
                    const stolenCard = opponentHand.splice(randIdx, 1)[0];
                    myHand.push(stolenCard);
                    setMyHand(state, myHand);
                    setOpponentHand(state, opponentHand);
                }
                return 'favor';
            }

            return null;
        }

        function drawAndEndTurn() {
            const state = readGameState();
            if (!isMyTurn(state)) return;

            if (state.deck.length === 0) {
                state.message = 'Deck is empty!';
                state.messageType = 'info';
                state.gameOver = true;
                writeGameState(state);
                renderUI(state);
                return;
            }

            const myHand = getMyHand(state);
            const card = state.deck.pop();
            myHand.push(card);

            if (card.type === CARD_TYPES.EXPLODING) {
                const defuseIdx = myHand.findIndex(c => c.type === CARD_TYPES.DEFUSE);
                if (defuseIdx !== -1) {
                    myHand.splice(defuseIdx, 1);
                    const ekIdx = myHand.indexOf(card);
                    myHand.splice(ekIdx, 1);
                    const pos = Math.floor(Math.random() * (state.deck.length + 1));
                    state.deck.splice(pos, 0, card);
                    state.message = `${getMyName(state)} drew an Exploding Kitten! Used Defuse!`;
                    state.messageType = 'warning';
                } else {
                    state.message = `${getMyName(state)} drew an Exploding Kitten! No Defuse! Game Over!`;
                    state.messageType = 'danger';
                    if (myPlayerNum === 1) state.player1Alive = false;
                    else state.player2Alive = false;
                    const opponentNum = myPlayerNum === 1 ? 2 : 1;
                    state.gameOver = true;
                    state.winner = opponentNum;
                    setMyHand(state, myHand);
                    writeGameState(state);
                    renderUI(state);
                    return;
                }
            } else {
                state.message = `${getMyName(state)} drew a card`;
                state.messageType = 'info';
            }

            state.turnsRemaining--;
            if (state.turnsRemaining > 0) {
                state.message += `. Still ${state.turnsRemaining} turn(s) remaining!`;
            } else {
                const opponentNum = myPlayerNum === 1 ? 2 : 1;
                state.currentPlayer = opponentNum;
                state.turnsRemaining = 1;
            }

            setMyHand(state, myHand);
            selectedCardIndex = null;
            writeGameState(state);
            renderUI(state);
        }

        function showGameOver(winnerName, playerWon) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('gameOverTitle');
            const message = document.getElementById('gameOverMessage');
            if (playerWon) {
                title.textContent = 'You Win!';
                message.textContent = 'Congratulations! You survived the Exploding Kittens!';
            } else {
                title.textContent = 'Game Over';
                message.textContent = `${winnerName} has won! Better luck next time!`;
            }
            modal.classList.add('active');
        }

        function goHome() {
            localStorage.removeItem(GAME_META_KEY);
            localStorage.removeItem(GAME_STATE_KEY);
            window.location.href = 'onlineconnecter.html';
        }

        function showMessage(text, type) {
            const el = document.getElementById('gameMessage');
            el.textContent = text;
            el.className = 'game-message ' + (type || 'info');
        }

        function getCardClass(cardType) {
            switch(cardType) {
                case CARD_TYPES.EXPLODING: return 'exploding';
                case CARD_TYPES.DEFUSE: return 'defuse';
                case CARD_TYPES.SKIP: return 'skip';
                case CARD_TYPES.ATTACK: return 'attack';
                case CARD_TYPES.FAVOR: return 'favor';
                case CARD_TYPES.SHUFFLE: return 'shuffle';
                case CARD_TYPES.PEEK: return 'peek';
                case CARD_TYPES.NOPE: return 'nope';
                default: return '';
            }
        }

        function getCardEmoji(cardType) {
            switch(cardType) {
                case CARD_TYPES.EXPLODING: return '💣';
                case CARD_TYPES.DEFUSE: return '🧯';
                case CARD_TYPES.SKIP: return '⏭️';
                case CARD_TYPES.ATTACK: return '⚔️';
                case CARD_TYPES.FAVOR: return '🙏';
                case CARD_TYPES.SHUFFLE: return '🔀';
                case CARD_TYPES.PEEK: return '👀';
                case CARD_TYPES.NOPE: return '🚫';
                default: return '🎴';
            }
        }

        function renderUI(state) {
            if (!state) return;

            const myHand = getMyHand(state);
            const opponentHand = getOpponentHand(state);
            const myTurn = isMyTurn(state);

            document.getElementById('playerHandCount').textContent = myHand.length;
            document.getElementById('opponentHandCount').textContent = opponentHand.length;
            document.getElementById('deckCount').textContent = state.deck.length + ' cards';
            document.getElementById('playedCount').textContent = state.playedPile.length + ' cards';

            if (state.playedPile.length > 0) {
                const lastCard = state.playedPile[state.playedPile.length - 1];
                document.getElementById('playedCardType').textContent = getCardEmoji(lastCard.type);
            }

            document.getElementById('playerStatus').textContent = myTurn ? 'Active' : 'Waiting';
            document.getElementById('opponentStatus').textContent = myTurn ? 'Waiting' : 'Active';

            const turnIndicator = document.getElementById('turnIndicator');
            if (myTurn) {
                if (state.turnsRemaining > 1) {
                    turnIndicator.textContent = `YOU ARE ATTACKED! ${state.turnsRemaining} turns remaining!`;
                } else {
                    turnIndicator.textContent = 'Your Turn - Play cards (optional), then draw!';
                }
                turnIndicator.className = 'turn-indicator your-turn';
            } else {
                turnIndicator.textContent = `${getOpponentName(state)}'s Turn`;
                turnIndicator.className = 'turn-indicator opponent-turn';
            }

            if (localPeekMessage) {
                showMessage(localPeekMessage, 'info');
                localPeekMessage = null;
            } else {
                showMessage(state.message || '', state.messageType || 'info');
            }

            document.getElementById('playCardBtn').disabled = !myTurn || selectedCardIndex === null;
            document.getElementById('drawCardBtn').disabled = !myTurn;
            document.getElementById('drawDeckBtn').style.pointerEvents = myTurn ? 'auto' : 'none';
            document.getElementById('drawDeckBtn').style.opacity = myTurn ? '1' : '0.5';

            const cardsDiv = document.getElementById('playerCards');
            cardsDiv.innerHTML = '';
            myHand.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card ' + getCardClass(card.type);
                if (selectedCardIndex === index) cardDiv.classList.add('selected');
                cardDiv.textContent = getCardEmoji(card.type) + '\n' + card.type.substring(0, 8);

                const canSelect = myTurn && card.type !== CARD_TYPES.EXPLODING &&
                    !(card.type === CARD_TYPES.DEFUSE && !myHand.some(c => c.type === CARD_TYPES.EXPLODING));

                if (canSelect) {
                    cardDiv.onclick = () => selectCard(index);
                    cardDiv.style.cursor = 'pointer';
                } else {
                    cardDiv.classList.add('disabled');
                }

                cardsDiv.appendChild(cardDiv);
            });

            if (state.gameOver && state.winner) {
                const winnerName = state.winner === 1 ? state.player1Name : state.player2Name;
                showGameOver(winnerName, state.winner === myPlayerNum);
            }
        }

        window.addEventListener('load', initGame);
    </script>
</body>
</html>
